<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BANK Policy Desk</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --ink: #14233c;
    --ink-soft: #4a5a72;
    --blue: #1f4e89;
    --blue-dark: #173d6b;
    --mist: #edf1f5;
    --paper: #ffffff;
    --line: #d5dce5;
    --brass: #a57f2c;
    --brass-tint: #faf3e2;
    --green: #1e7a5a;
    --green-tint: #e8f5ef;
    --amber: #9a5a00;
    --amber-tint: #fff4e0;
    --red: #b3261e;
    --red-tint: #fdeceb;
    --serif: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
    --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    margin: 0; background: var(--mist); color: var(--ink);
    font: 15px/1.55 var(--sans); display: flex; flex-direction: column;
  }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #7aa7e0; outline-offset: 2px; }

  /* header */
  header {
    background: var(--ink); color: #fff; border-bottom: 3px solid var(--brass);
    display: flex; align-items: center; gap: 16px; padding: 0 20px; height: 58px; flex: none;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { display: block; }
  .ops-link { color: #dbe5f5; font-size: 13px; text-decoration: none; border: 1px solid #ffffff30; border-radius: 999px; padding: 4px 12px; margin-left: 10px; }
  .ops-link:hover { background: #ffffff18; }
  .wordmark { font: 600 21px/1 var(--serif); letter-spacing: .2px; }
  .divider { width: 1px; height: 22px; background: #ffffff40; }
  .product { font-size: 14px; color: #c9d4e6; }
  .spacer { flex: 1; }
  .status {
    display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #dbe5f5;
    border: 1px solid #ffffff30; border-radius: 999px; padding: 4px 12px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #6fd0a6; }
  .dot.off { background: #e8b04a; }
  .lib-toggle { display: none; background: transparent; border: 1px solid #ffffff50; color: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; }

  /* layout */
  main { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr) 390px; grid-template-rows: minmax(0, 1fr); }
  .pane { min-height: 0; overflow-y: auto; }

  /* library */
  .library { background: var(--paper); border-right: 1px solid var(--line); padding: 18px 0 24px; }
  .library h2 { font: 600 17px/1.2 var(--serif); margin: 0 18px 4px; }
  .library .count { margin: 0 18px 12px; color: var(--ink-soft); font-size: 13px; }
  .search { margin: 0 18px 10px; width: calc(100% - 36px); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--mist); }
  .cat { margin: 14px 18px 4px; font-weight: 600; font-size: 13px; color: var(--ink-soft); }
  .doc-btn {
    display: block; width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent;
    padding: 8px 18px 8px 15px; cursor: pointer;
  }
  .doc-btn:hover { background: var(--mist); }
  .doc-btn.active { background: var(--brass-tint); border-left-color: var(--brass); }
  .doc-btn .code { font-size: 12px; color: var(--blue); font-weight: 600; font-variant-numeric: tabular-nums; }
  .doc-btn .name { display: block; line-height: 1.3; }
  .doc-btn .ver { display: block; font-size: 12px; color: var(--ink-soft); }
  .no-match { margin: 14px 18px; color: var(--ink-soft); }

  /* conversation */
  .chat { display: flex; flex-direction: column; min-width: 0; }
  .thread { flex: 1; min-height: 0; overflow-y: auto; padding: 28px 32px 12px; }
  .thread-inner { max-width: 720px; margin: 0 auto; }
  .welcome h1 { font: 600 30px/1.2 var(--serif); margin: 12px 0 8px; }
  .welcome p { color: var(--ink-soft); max-width: 54ch; margin: 0 0 22px; }
  .suggest { display: grid; gap: 8px; }
  .suggest button {
    text-align: left; background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; cursor: pointer;
  }
  .suggest button:hover { border-color: var(--blue); }
  .turn { margin-bottom: 26px; }
  .q { margin: 0 0 10px; font-weight: 600; padding-left: 12px; border-left: 3px solid var(--blue); }
  .answer { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; border-top: 4px solid var(--green); overflow: hidden; }
  .answer.refused { border-top-color: var(--amber); }
  .answer.error { border-top-color: var(--red); }
  .answer-head { display: flex; align-items: center; gap: 12px; padding: 12px 16px 0; }
  .badge { font-weight: 600; font-size: 13px; color: var(--green); background: var(--green-tint); border-radius: 999px; padding: 2px 10px; }
  .refused .badge { color: var(--amber); background: var(--amber-tint); }
  .error .badge { color: var(--red); background: var(--red-tint); }
  .meta { margin-left: auto; font-size: 12.5px; color: var(--ink-soft); }
  .answer-text { margin: 10px 16px 14px; font-size: 16.5px; line-height: 1.6; max-width: 62ch; }
  .note { margin: 0 16px 12px; font-size: 13px; color: var(--ink-soft); }
  .note.warn { color: var(--ink); background: #fdf3dc; border-left: 3px solid #d9a300; padding: 8px 10px; border-radius: 4px; }
  .gw { margin: 0; padding: 8px 16px; font-size: 12.5px; color: var(--ink-soft); border-top: 1px solid var(--line); background: #f9fafc; }
  .sources { border-top: 1px solid var(--line); padding: 10px 16px 14px; background: #f9fafc; }
  .sources .label { font-size: 13px; color: var(--ink-soft); margin-right: 6px; }
  .src-btn {
    display: inline-flex; align-items: baseline; gap: 6px; margin: 4px 6px 0 0; padding: 5px 10px; cursor: pointer;
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
  }
  .src-btn:hover { border-color: var(--blue); }
  .src-btn.active { border-color: var(--brass); background: var(--brass-tint); }
  .src-btn .code { font-weight: 600; color: var(--blue); font-size: 13px; font-variant-numeric: tabular-nums; }
  .src-btn .sec { font-size: 13px; }
  .checks { border-top: 1px solid var(--line); background: #f9fafc; }
  .checks summary { cursor: pointer; padding: 10px 16px; font-size: 13px; color: var(--ink-soft); list-style: none; display: flex; align-items: center; gap: 8px; }
  .checks summary::-webkit-details-marker { display: none; }
  .checks summary::before { content: ""; width: 6px; height: 6px; border-right: 2px solid var(--ink-soft); border-bottom: 2px solid var(--ink-soft); transform: rotate(-45deg); }
  .checks[open] summary::before { transform: rotate(45deg); }
  .checks summary strong { color: var(--ink); }
  .check-list { list-style: none; margin: 0; padding: 0 16px 12px; }
  .check-list li { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 7px 0; border-top: 1px solid #e8ecf1; font-size: 13.5px; line-height: 1.45; }
  .chk-state { font-weight: 600; font-size: 12.5px; }
  .chk-state.pass { color: var(--green); }
  .chk-state.action { color: var(--blue); }
  .chk-state.blocked { color: var(--red); }
  .chk-state.skipped { color: #7d8a9d; font-weight: 500; }
  .chk-name { font-weight: 600; }
  .chk-detail { display: block; color: var(--ink-soft); }
  .escalate { margin: 0 16px 14px; }
  .esc-btn { background: var(--paper); border: 1px solid var(--blue); color: var(--blue); border-radius: 6px; padding: 7px 14px; font-weight: 600; cursor: pointer; }
  .esc-btn:hover { background: #eaf1fa; }
  .esc-btn:disabled { opacity: .6; cursor: wait; }
  .esc-done { font-size: 14px; color: var(--green); font-weight: 600; margin: 0; }

  .pending { color: var(--ink-soft); padding: 14px 16px; }
  .pending::after { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--blue); margin-left: 8px; animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .2; } }
  @media (prefers-reduced-motion: reduce) { .pending::after { animation: none; } }

  .composer { flex: none; border-top: 1px solid var(--line); background: var(--paper); padding: 14px 32px 12px; }
  .composer-inner { max-width: 720px; margin: 0 auto; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; resize: none; border: 1px solid #aeb9c9; border-radius: 8px; padding: 10px 12px; min-height: 48px; max-height: 120px; background: #fff; }
  .ask-btn { background: var(--blue); color: #fff; border: 0; border-radius: 8px; padding: 0 22px; height: 48px; font-weight: 600; cursor: pointer; }
  .ask-btn:hover { background: var(--blue-dark); }
  .ask-btn:disabled { background: #93a5be; cursor: not-allowed; }
  .fine { margin: 8px 0 0; font-size: 12.5px; color: var(--ink-soft); }

  /* source viewer */
  .viewer { background: var(--mist); border-left: 1px solid var(--line); padding: 18px; }
  .viewer-title { font-size: 13px; color: var(--ink-soft); margin: 0 0 10px; }
  .empty { background: var(--paper); border: 1px dashed #aeb9c9; border-radius: 8px; padding: 22px 18px; color: var(--ink-soft); }
  .empty strong { display: block; color: var(--ink); font: 600 16px/1.3 var(--serif); margin-bottom: 6px; }
  .page { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 24px 24px 18px; box-shadow: 0 1px 0 var(--line), 0 6px 18px #14233c14; }
  .page .code { font-size: 13px; font-weight: 600; color: var(--brass); font-variant-numeric: tabular-nums; }
  .page h2 { font: 600 22px/1.25 var(--serif); margin: 2px 0 6px; }
  .page .pmeta { font-size: 13px; color: var(--ink-soft); padding-bottom: 12px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .clause { padding: 10px 0 10px 12px; margin: 4px 0 4px -12px; border-left: 4px solid transparent; }
  .clause h3 { font: 600 15px/1.3 var(--sans); margin: 0 0 3px; }
  .clause p { margin: 0; font-family: var(--serif); font-size: 15.5px; line-height: 1.65; }
  .clause.cited { background: var(--brass-tint); border-left-color: var(--brass); }
  .clause .tag { display: block; font-size: 12px; color: var(--brass); font-weight: 600; margin-bottom: 2px; }

  /* narrow screens */
  @media (max-width: 1180px) {
    main { grid-template-columns: minmax(0, 1fr) 360px; }
    .library { display: none; position: fixed; inset: 61px 0 0 0; z-index: 5; width: 300px; box-shadow: 0 0 40px #0006; }
    body.lib-open .library { display: block; }
    .lib-toggle { display: inline-block; }
  }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: none; overflow-y: auto; }
    .chat { min-height: 70vh; }
    .viewer { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    .thread { padding: 20px 16px 8px; }
    .composer { padding: 12px 16px; }
    .product, .divider { display: none; }
    .status span:last-child { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true">
      <rect width="30" height="30" rx="6" fill="#1f4e89"/>
      <path d="M5 11c3-3 5-3 7.500 0s5 3 7.500 0 3-2 5-1" fill="none" stroke="#d9b45c" stroke-width="2" stroke-linecap="round"/>
      <path d="M5 17c3-3 5-3 7.500 0s5 3 7.500 0 3-2 5-1" fill="none" stroke="#d9b45c" stroke-width="2" stroke-linecap="round"/>
      <path d="M5 23c3-3 5-3 7.500 0s5 3 7.500 0 3-2 5-1" fill="none" stroke="#d9b45c" stroke-width="2" stroke-linecap="round"/>
    </svg>
    <span class="wordmark">BANK</span>
    <span class="divider"></span>
    <span class="product">Policy Desk</span>
  </div>
  <span class="spacer"></span>
  <span class="status" id="status"><span class="dot off"></span><span>Checking...</span></span>
  <a class="ops-link" href="/ops">Operations</a>
  <button class="lib-toggle" id="libToggle" type="button">Policy library</button>
</header>

<main>
  <nav class="pane library" aria-label="Policy library">
    <h2>Policy library</h2>
    <p class="count" id="libCount"></p>
    <input class="search" id="libSearch" type="search" placeholder="Filter policies" aria-label="Filter policies">
    <div id="libList"></div>
  </nav>

  <section class="chat" aria-label="Ask a question">
    <div class="thread" id="thread">
      <div class="thread-inner" id="threadInner" aria-live="polite"></div>
    </div>
    <form class="composer" id="form">
      <div class="composer-inner">
        <div class="row">
          <textarea id="q" rows="1" maxlength="500" placeholder="Ask about a policy, for example: how long do I have to report suspected fraud?" aria-label="Your question"></textarea>
          <button class="ask-btn" id="askBtn" type="submit">Ask</button>
        </div>
        <p class="fine">Answers come only from the policy library. Read the cited clause before you act. Do not type customer account numbers.</p>
      </div>
    </form>
  </section>

  <aside class="pane viewer" id="viewer" aria-label="Policy source"></aside>
</main>

<script>
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(kid));
  return el;
}
const fmtDate = iso => new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const SUGGESTED = [
  "How long do I have to report suspected fraud?",
  "What happens if I find counterfeit notes in a deposit?",
  "Can I paste customer details into a public AI chatbot?",
  "Who approves a personal loan of INR 10 lakh?"
];
let docs = [], activeDoc = null, activeClause = null, busy = false;

/* ---------- header status ---------- */
async function loadHealth() {
  try {
    const d = await (await fetch("/api/health")).json();
    const live = d.mode === "ai";
    $("#status").replaceChildren(
      h("span", { class: "dot" + (live ? "" : " off") }),
      h("span", {}, live ? "AI answers on" : "Search only"),
    );
    $("#status").title = live ? "Model: " + d.model : "No OpenRouter key found. Showing the closest policy clause instead of a written answer.";
  } catch { $("#status").replaceChildren(h("span", { class: "dot off" }), h("span", {}, "Server not reachable")); }
}

/* ---------- library ---------- */
function renderLibrary() {
  const f = $("#libSearch").value.trim().toLowerCase();
  const list = $("#libList"); list.replaceChildren();
  const shown = docs.filter(d => !f || (d.code + " " + d.title + " " + d.category).toLowerCase().includes(f));
  $("#libCount").textContent = docs.length + " policies in force";
  if (!shown.length) return list.append(h("p", { class: "no-match" }, "No policy matches that filter."));
  const cats = [...new Set(shown.map(d => d.category))].sort();
  for (const c of cats) {
    list.append(h("div", { class: "cat" }, c));
    for (const d of shown.filter(x => x.category === c)) {
      list.append(h("button", { class: "doc-btn" + (d.code === activeDoc ? " active" : ""), type: "button", onclick: () => openDoc(d.code, null) },
        h("span", { class: "code" }, d.code),
        h("span", { class: "name" }, d.title),
        h("span", { class: "ver" }, "Version " + d.version + ", effective " + fmtDate(d.effective))));
    }
  }
}

/* ---------- source viewer ---------- */
function renderViewerEmpty() {
  $("#viewer").replaceChildren(
    h("p", { class: "viewer-title" }, "Policy source"),
    h("div", { class: "empty" }, h("strong", {}, "Nothing open yet"),
      "Choose a source under an answer to see the exact clause, or open any policy from the library."));
}
async function openDoc(code, section) {
  activeDoc = code; activeClause = section ? code + "|" + section : null;
  renderLibrary(); markSources();
  document.body.classList.remove("lib-open");
  const v = $("#viewer");
  try {
    const d = await (await fetch("/api/docs/" + encodeURIComponent(code))).json();
    if (d.error) throw new Error(d.error);
    const page = h("article", { class: "page" },
      h("div", { class: "code" }, d.code),
      h("h2", {}, d.title),
      h("div", { class: "pmeta" }, d.category + ", version " + d.version + ", effective " + fmtDate(d.effective)),
      d.sections.map(s => {
        const cited = s.section === section;
        return h("div", { class: "clause" + (cited ? " cited" : ""), id: cited ? "citedClause" : null },
          cited ? h("span", { class: "tag" }, "Cited in the answer") : null,
          h("h3", {}, s.section), h("p", {}, s.text));
      }));
    v.replaceChildren(h("p", { class: "viewer-title" }, "Policy source"), page);
    const target = $("#citedClause");
    const calm = matchMedia("(prefers-reduced-motion: reduce)").matches;
    v.scrollTop = 0;
    if (target) {
      const r = target.getBoundingClientRect(), vr = v.getBoundingClientRect();
      if (r.bottom > vr.bottom - 24) v.scrollTo({ top: v.scrollTop + (r.top - vr.top) - 140, behavior: calm ? "auto" : "smooth" });
    }
  } catch (e) {
    v.replaceChildren(h("p", { class: "viewer-title" }, "Policy source"), h("div", { class: "empty" }, h("strong", {}, "Could not open this policy"), e.message));
  }
}
function markSources() {
  document.querySelectorAll(".src-btn").forEach(b => b.classList.toggle("active", b.dataset.key === activeClause));
}

/* ---------- conversation ---------- */
function renderWelcome() {
  $("#threadInner").replaceChildren(h("div", { class: "welcome" },
    h("h1", {}, "Ask a policy question"),
    h("p", {}, "Policy Desk answers from the " + docs.length + " policies in the library and shows you the clause it used. If the policies do not cover your question, it says so instead of guessing."),
    h("div", { class: "suggest" }, SUGGESTED.map(s => h("button", { type: "button", onclick: () => { $("#q").value = s; submit(); } }, s)))));
}
const REFUSALS = {
  injection: ["This request can't be answered here", "Policy Desk only answers questions about bank policy and cannot change its own rules."],
  advice: ["This needs a human adviser", "Policy Desk does not give investment, legal or tax advice. Escalate it to the Compliance Desk."],
  budget_exceeded: ["Daily AI budget used up", "This team has used its token budget for today. Try again tomorrow or ask an administrator to raise the budget."],
  default: ["Not covered by the policy library", "The library has nothing that answers this, so no answer is given. Escalate it to the Compliance Desk before you act."]
};
function sourceButtons(citations) {
  return h("div", { class: "sources" }, h("span", { class: "label" }, citations.length > 1 ? "Sources" : "Source"),
    citations.map(c => {
      const key = c.doc_id + "|" + c.section;
      return h("button", { class: "src-btn" + (key === activeClause ? " active" : ""), type: "button", "data-key": key, onclick: () => openDoc(c.doc_id, c.section) },
        h("span", { class: "code" }, c.doc_id), h("span", { class: "sec" }, c.section));
    }));
}
const STATE_LABEL = { pass: "Passed", action: "Masked", blocked: "Stopped it", skipped: "Not reached" };
function checksPanel(r) {
  const items = r.checks || [];
  const blocked = items.find(c => c.state === "blocked");
  const passed = items.filter(c => c.state === "pass" || c.state === "action").length;
  const masked = items.some(c => c.state === "action");
  const summary = blocked
    ? h("summary", {}, "Guardrail checks: ", h("strong", {}, "stopped by " + blocked.label.toLowerCase()))
    : h("summary", {}, "Guardrail checks: ", h("strong", {}, passed + " of " + items.length + " passed"), masked ? " (personal data masked)" : "");
  const d = h("details", { class: "checks" }, summary,
    h("ul", { class: "check-list" }, items.map(c => h("li", {},
      h("span", { class: "chk-state " + c.state }, STATE_LABEL[c.state]),
      h("span", {}, h("span", { class: "chk-name" }, c.label), h("span", { class: "chk-detail" }, c.detail))))));
  if (blocked) d.open = true;
  return d;
}
function escalateBox(r) {
  const box = h("div", { class: "escalate" });
  const btn = h("button", { class: "esc-btn", type: "button" }, "Escalate to Compliance Desk");
  btn.addEventListener("click", async () => {
    btn.disabled = true;
    try {
      const res = await fetch("/api/escalate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: r.question, reason: r.reason }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Could not escalate.");
      box.replaceChildren(h("p", { class: "esc-done" }, "Escalated. Ticket " + data.ticket + " is logged for the Compliance Desk."));
    } catch (e) { btn.disabled = false; box.append(h("p", { class: "note" }, e.message + " Try again.")); }
  });
  box.append(btn);
  return box;
}
function gatewayLine(r) {
  const g = r.gateway;
  if (!g) return null;
  let text;
  if (g.cache === "hit") text = "Answer cache hit, no AI call used";
  else if (g.model) text = g.model + " (" + g.tier + " route), " + g.tokens.toLocaleString("en-IN") + " tokens";
  else return null;
  return h("p", { class: "gw" }, text + ". Trace " + g.trace);
}
function renderResult(r, secs) {
  const searchOnly = r.mode === "search-only";
  const meta = (searchOnly ? "Search only" : (r.provider || "AI")) + ", " + secs + " s";
  const maskNote = r.masked ? h("p", { class: "note" }, "Account or ID numbers in your question were masked before it was processed.") : null;
  if (r.status === "answered") {
    return h("div", { class: "answer" },
      h("div", { class: "answer-head" }, h("span", { class: "badge" }, searchOnly ? "Closest clause" : "Answered from policy"), h("span", { class: "meta" }, meta)),
      h("p", { class: "answer-text" }, r.answer),
      r.notice ? h("p", { class: "note warn" }, r.notice)
        : searchOnly ? h("p", { class: "note" }, "Search-only mode: this is the closest policy text, not a written answer.") : null,
      maskNote, sourceButtons(r.citations), gatewayLine(r), checksPanel(r));
  }
  const [title, body] = REFUSALS[r.reason] || REFUSALS.default;
  return h("div", { class: "answer refused" },
    h("div", { class: "answer-head" }, h("span", { class: "badge" }, "Not answered"), h("span", { class: "meta" }, meta)),
    h("p", { class: "answer-text" }, h("strong", {}, title + ". "), body),
    maskNote,
    r.reason === "injection" ? null : escalateBox(r),
    checksPanel(r));
}
async function submit() {
  const input = $("#q"), q = input.value.trim();
  if (!q || busy) return;
  busy = true; $("#askBtn").disabled = true; input.value = ""; autosize();
  const inner = $("#threadInner");
  if (inner.querySelector(".welcome")) inner.replaceChildren();
  const slot = h("div", { class: "answer" }, h("div", { class: "pending" }, "Searching " + docs.length + " policies"));
  const turn = h("div", { class: "turn" }, h("p", { class: "q" }, q), slot);
  inner.append(turn);
  $("#thread").scrollTop = $("#thread").scrollHeight;
  const t0 = performance.now();
  try {
    const res = await fetch("/api/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    const card = renderResult(data, ((performance.now() - t0) / 1000).toFixed(1));
    slot.replaceWith(card);
    if (data.status === "answered" && data.citations.length) openDoc(data.citations[0].doc_id, data.citations[0].section);
  } catch (e) {
    slot.replaceWith(h("div", { class: "answer error" },
      h("div", { class: "answer-head" }, h("span", { class: "badge" }, "Could not answer")),
      h("p", { class: "answer-text" }, e.message + " Try again in a moment.")));
  }
  busy = false; $("#askBtn").disabled = false; input.focus();
  $("#thread").scrollTop = $("#thread").scrollHeight;
}
function autosize() { const t = $("#q"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 120) + "px"; }

/* ---------- start ---------- */
$("#form").addEventListener("submit", e => { e.preventDefault(); submit(); });
$("#q").addEventListener("input", autosize);
$("#q").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); } });
$("#libSearch").addEventListener("input", renderLibrary);
$("#libToggle").addEventListener("click", () => document.body.classList.toggle("lib-open"));
(async function init() {
  renderViewerEmpty(); loadHealth();
  try { docs = await (await fetch("/api/docs")).json(); } catch { docs = []; }
  renderLibrary(); renderWelcome();
})();
</script>
</body>
